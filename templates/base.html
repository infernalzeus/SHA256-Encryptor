<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Passkey{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --accent-dim: #4a44b5;
      --danger: #e05c5c;
      --text: #e2e4f0;
      --muted: #7a7f99;
      --success: #4caf82;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav .brand {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: 0.5px;
      text-decoration: none;
    }

    nav .nav-links { display: flex; gap: 0.75rem; align-items: center; }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }

    nav a:hover { background: var(--border); color: var(--text); }

    nav a.btn-nav {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    nav a.btn-nav:hover { background: var(--accent-dim); }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .flash-list { list-style: none; margin-bottom: 1rem; }

    .flash-list li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 0.65rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 0.55rem 1.1rem;
      border-radius: 7px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-ghost   { background: var(--border);  color: var(--text); }

    /* Forms */
    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 0.35rem;
    }

    input[type="text"],
    input[type="password"],
    input[type="search"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
    }

    /* Utility */
    .page-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    .muted { color: var(--muted); }

    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }

    @media (max-width: 480px) {
      .btn { padding: 0.55rem 0.9rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% if session.authenticated %}
  <nav>
    <a class="brand" href="{{ url_for('index') }}">🔐 Passkey</a>
    <div class="nav-links">
      <a href="{{ url_for('add') }}" class="btn-nav">+ Add</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </nav>
  {% endif %}

  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-list">
          {% for m in messages %}<li>{{ m }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
